name: cd
on:
  push:
    branches: [main]
jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: install dependencies
        run: go mod download

      - name: build app
        run: CGO_ENABLED=0 GOOS=linux go build -o realtorbackend .

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: dgarcia51/realtorbackend:${{ github.sha }}, dgarcia51/realtorbackend:latest
          secrets: |
            "PORT=${{ secrets.PORT }}"
            "DATABASE_URL='${{ secrets.DATABASE_URL }}'"
            "TOKEN_SECRET=${{ secrets.TOKEN_SECRET }}"
            "S3_REGION=${{ secrets.S3_REGION }}"
            "S3_BUCKET=${{ secrets.S3_BUCKET }}"
            "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}"
            "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}"
            "CRM_API_KEY=${{ secrets.CRM_API_KEY }}"
            "POSTMARK_SERVER_TOKEN=${{ secrets.POSTMARK_SERVER_TOKEN }}"
            "FROM_EMAIL_ADDRESS=${{ secrets.FROM_EMAIL_ADDRESS }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-and-push
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo PORT=${{ secrets.PORT }} >> .env
          echo DATABASE_URL="${{ secrets.DATABASE_URL }}" >> .env
          echo TOKEN_SECRET=${{ secrets.TOKEN_SECRET }} >> .env
          echo S3_REGION=${{ secrets.S3_REGION }} >> .env
          echo S3_BUCKET=${{ secrets.S3_BUCKET }} >> .env
          echo AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} >> .env
          echo AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} >> .env
          echo BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} >> .env
          echo CRM_API_KEY=${{ secrets.CRM_API_KEY }} >> .env
          echo POSTMARK_SERVER_TOKEN=${{ secrets.POSTMARK_SERVER_TOKEN }} >> .env
          echo FROM_EMAIL_ADDRESS=${{ secrets.FROM_EMAIL_ADDRESS }} >> .env

      - name: deploy stack
        uses: cssnr/stack-deploy-action@v1
        with:
          name: realtorbackend
          file: docker-compose.yml
          host: soldbyghost.com
          user: ghost
          ssh_key: ${{ secrets.SSH_KEY }}
          env_file: .env
